[project]
name = "simucore-backend"
version = "0.1.0"
description = "SimuCore - self-calibrating 3D digital twin framework for banking infrastructure (backend)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI `Depends()` in defaults is idiomatic. UP042: `str, Enum` kept for clarity.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"app/simulation/bank_topology.py" = ["E501"]  # tabular reference data
"app/adapters/prometheus.py" = ["E501"]       # PromQL templates

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
