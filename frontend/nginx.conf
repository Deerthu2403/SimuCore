server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the backend on every request (Docker's DNS) instead of once at start-up, so a
  # recreated backend container with a new address keeps working.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $backend http://backend:8000;

  location /api/ {
    proxy_pass $backend;
  }

  location /ws/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  set $monitoring http://monitoring:8200;
  location /monitoring/ {
    rewrite ^/monitoring/(.*)$ /$1 break;
    proxy_pass $monitoring;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
