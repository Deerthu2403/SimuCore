apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: SimuCore-Postgres
    type: postgres
    url: postgres:5432
    user: simucore
    secureJsonData:
      password: simucore
    jsonData:
      database: simucore
      sslmode: disable
