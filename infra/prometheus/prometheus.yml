global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: simucore-backend
    metrics_path: /metrics/
    static_configs:
      - targets: ["backend:8000"]

  - job_name: monitoring
    static_configs:
      - targets: ["monitoring:8200"]

  # The simulated bank publishes its ports on this PC's loopback, whether it runs as local
  # processes or as containers; host.docker.internal reaches both. The target's own "service"
  # label wins over the one on the page, so a service cannot pose as another.
  - job_name: bank
    scrape_interval: 1s
    scrape_timeout: 1s
    static_configs:
      - targets: ["host.docker.internal:8101"]
        labels: {service: authentication}
      - targets: ["host.docker.internal:8102"]
        labels: {service: customer}
      - targets: ["host.docker.internal:8103"]
        labels: {service: account}
      - targets: ["host.docker.internal:8104"]
        labels: {service: transaction}
      - targets: ["host.docker.internal:8105"]
        labels: {service: payment}
      - targets: ["host.docker.internal:8106"]
        labels: {service: fraud}
      - targets: ["host.docker.internal:8107"]
        labels: {service: notification}
      - targets: ["host.docker.internal:8108"]
        labels: {service: database}

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: intelligence
    static_configs:
      - targets: ["intelligence:8300"]
