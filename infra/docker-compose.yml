name: simucore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simucore
      POSTGRES_USER: ${POSTGRES_USER:-simucore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simucore}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simucore} -d simucore"]
      interval: 10s
      retries: 5

  backend:
    build: ../backend
    env_file: ../.env
    environment:
      SIMUCORE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-simucore}:${POSTGRES_PASSWORD:-simucore}@postgres:5432/simucore
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    ports: ["8080:8080"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [backend]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
