# SimuCore platform: backend, 3D UI, PostgreSQL, Prometheus, Grafana.
# From the repository root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# Every password must come from .env: there are no defaults, so forgetting --env-file fails
# loudly instead of starting with a guessable password. Ports are reachable from this PC only.
name: simucore

x-common: &common
  restart: on-failure:5   # recover from crashes, but never start by itself with Docker
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simucore
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set it in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h: the temporary server used during initialisation listens on the socket only, so
      # this stays unhealthy until the schema is really loaded.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d simucore"]
      interval: 5s
      retries: 12

  backend:
    <<: *common
    build: ../backend
    environment:
      SIMUCORE_LOG_LEVEL: ${SIMUCORE_LOG_LEVEL:-INFO}
      SIMUCORE_TELEMETRY_ADAPTER: ${SIMUCORE_TELEMETRY_ADAPTER:-simulated}
      SIMUCORE_MONITORING_URL: http://monitoring:8200
      SIMUCORE_BANK_URL_TEMPLATE: http://host.docker.internal:{port}
      SIMUCORE_BANK_MAP_PATH: /config/dependency_map.json
      SIMUCORE_TELEMETRY_INTERVAL_S: ${SIMUCORE_TELEMETRY_INTERVAL_S:-1.0}
      SIMUCORE_RANDOM_SEED: ${SIMUCORE_RANDOM_SEED:-42}
      SIMUCORE_INCIDENT_RATE: ${SIMUCORE_INCIDENT_RATE:-0.0003}
      SIMUCORE_TWIN_MONITORING_WS: ws://monitoring:8200/ws/metrics
      SIMUCORE_TWIN_AI_WS: ws://intelligence:8300/ws/insights
      SIMUCORE_TWIN_DATABASE_URL: postgresql://twin_writer:${TWIN_DB_PASSWORD}@postgres:5432/simucore
    volumes:
      - ../banking-sim/dependency_map.json:/config/dependency_map.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot: applies database/migrations and creates the service roles, then exits.
  migrate:
    image: postgres:16-alpine
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["sh", "/migrate.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?set it in .env}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?set it in .env}
      TWIN_DB_PASSWORD: ${TWIN_DB_PASSWORD:?set it in .env}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?set it in .env}
    volumes:
      - ../database/migrate.sh:/migrate.sh:ro
      - ../database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  monitoring:
    <<: *common
    build: ../monitoring
    environment:
      MONITOR_SOURCE: ${MONITOR_SOURCE:-prometheus}
      MONITOR_PROMETHEUS_URL: http://prometheus:9090
      MONITOR_BANK_URL_TEMPLATE: http://host.docker.internal:{port}
      MONITOR_SERVICES_FILE: /config/dependency_map.json
      MONITOR_DATABASE_URL: postgresql://monitor_writer:${MONITOR_DB_PASSWORD}@postgres:5432/simucore
    volumes:
      - ../banking-sim/dependency_map.json:/config/dependency_map.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8200:8200"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Anomaly detection and failure prediction. Reads the monitoring stream, acts on nothing.
  intelligence:
    <<: *common
    build: ../intelligence
    environment:
      AI_MONITORING_WS: ws://monitoring:8200/ws/metrics
      AI_SERVICES_FILE: /config/dependency_map.json
      AI_DATABASE_URL: postgresql://ai_writer:${AI_DB_PASSWORD}@postgres:5432/simucore
    volumes:
      - ../banking-sim/dependency_map.json:/config/dependency_map.json:ro
    ports: ["127.0.0.1:8300:8300"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  node-exporter:
    <<: *common
    # Reports the Linux machine Docker runs in (on Windows: Docker Desktop's virtual machine).
    image: prom/node-exporter:v1.8.2
    command: ["--path.procfs=/proc", "--collector.disable-defaults", "--collector.cpu",
              "--collector.meminfo", "--collector.loadavg", "--collector.diskstats",
              "--collector.uname"]

  postgres-exporter:
    <<: *common
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_URI: postgres:5432/simucore?sslmode=disable
      DATA_SOURCE_USER: metrics_exporter
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    <<: *common
    build: ../frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s

  prometheus:
    <<: *common
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s

  grafana:
    <<: *common
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set it in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set it in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s

volumes:
  pgdata:
  promdata:
  grafanadata:
